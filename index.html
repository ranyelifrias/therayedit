<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ray Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f0;--card:#fffdfa;--ink:#2b2622;--mute:#7a6d66;--blush:#f1cfcf;--rose:#d9a3a6;--sage:#5e7350;--gold:#b08d57;--line:#e9dcd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a19;--card:#2a2321;--ink:#f5ebe4;--mute:#b5a59c;--blush:#4a3337;--rose:#d9a3a6;--sage:#9db58d;--gold:#d2ad78;--line:#3d3230}}
:root[data-theme="dark"]{--bg:#1f1a19;--card:#2a2321;--ink:#f5ebe4;--mute:#b5a59c;--blush:#4a3337;--rose:#d9a3a6;--sage:#9db58d;--gold:#d2ad78;--line:#3d3230}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 17px/1.65 Jost,system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px;gap:14px;flex-wrap:wrap}
.logo{text-decoration:none;display:inline-block;line-height:1;cursor:pointer;background:none;border:0;color:inherit;text-align:left}
.logo small{display:block;font:italic 500 15px Cormorant Garamond,serif;margin-left:2px;color:var(--mute)}
.logo b{font:italic 600 32px Cormorant Garamond,serif;letter-spacing:.2px}
.logo i{font-style:normal;color:var(--gold);font-size:16px;margin-left:4px}
.logo u{display:block;height:2px;width:72%;background:var(--gold);text-decoration:none;margin-top:2px}
nav{display:flex;gap:6px}
nav button{font:400 15px Jost,sans-serif;background:none;border:0;color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer}
nav button:hover,nav button.on{background:var(--blush)}
.hand{font-family:'Nothing You Could Do',cursive}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:52px 0 40px}
.hero h1{font:italic 500 clamp(44px,7vw,80px)/1 Cormorant Garamond,serif;margin-bottom:18px}
.hero p{max-width:520px;color:var(--mute);margin-bottom:26px}
.frame{background:#fff;padding:12px 12px 44px;border-radius:4px;box-shadow:0 18px 40px -18px rgba(90,50,50,.45);transform:rotate(2deg);position:relative}
.frame img{display:block;width:100%;border-radius:2px}
.frame span{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#6b5a52;font-size:15px}
.btn{display:inline-block;background:var(--sage);color:#fff;padding:12px 26px;border-radius:99px;text-decoration:none;border:0;font:400 16px Jost,sans-serif;cursor:pointer}
.btn.alt{background:var(--blush);color:var(--ink);margin-left:8px}
section{padding:44px 0}
h2{font:italic 500 clamp(34px,5vw,48px)/1.1 Cormorant Garamond,serif;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.mb{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{font:300 15px Jost,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 16px}
.tools input{flex:1;min-width:200px}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.grid.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid.three{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}
.card h3{font:600 24px/1.2 Cormorant Garamond,serif}
.tag{font-size:13px;color:var(--sage)}
.card p{color:var(--mute);font-size:15.5px}
.post{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.post:hover{border-color:var(--rose)}
.swatch{height:120px;border-radius:12px;display:grid;place-items:center;font-size:40px;color:#fff;margin:-4px -4px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips button{font:400 14px Jost,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.price{font:600 26px Cormorant Garamond,serif;color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:10px}
.link{color:var(--sage);font-size:15px}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.shop{background:var(--blush);border-radius:28px;padding:38px 26px;margin:20px 0}
.shop .card{background:var(--card)}
article{max-width:660px;margin:0 auto;padding:44px 0}
article h1{font:italic 500 clamp(36px,6vw,56px)/1.05 Cormorant Garamond,serif;margin:6px 0 24px}
article p{font-size:18px;margin-bottom:18px}
.back{background:none;border:0;color:var(--sage);font:400 15px Jost,sans-serif;cursor:pointer;padding:0}
footer{border-top:1px solid var(--line);padding:30px 0 40px;text-align:center;color:var(--mute);font-size:14px}
footer .hand{font-size:20px;color:var(--ink);display:block;margin-bottom:6px}
.hidden{display:none}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:30px}.frame{max-width:340px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

let favCat='All';
let B={q:'',topic:'All',month:'All',sort:'new'};
const mk=p=>new Date(p.date).toLocaleString('en-US',{month:'long',year:'numeric'});
function showPosts(){
 const q=B.q.trim().toLowerCase();
 const l=POSTS.filter(p=>(B.topic==='All'||p.tag===B.topic)&&(B.month==='All'||mk(p)===B.month)&&(!q||[p.title,p.excerpt,p.tag,...p.body].join(' ').toLowerCase().includes(q)))
  .sort((a,b)=>(new Date(b.date)-new Date(a.date))*(B.sort==='new'?1:-1));
 document.getElementById('results').innerHTML=l.length?l.map(postCard).join(''):'<p class="sub" style="grid-column:1/-1">No posts match yet. Try a different search or filter.</p>';
}

const postCard=p=>`<button class="card post" onclick="go('post','${p.id}')"><div class="swatch" style="background:${p.color}">${p.emoji}</div><span class="tag">${esc(p.tag)} · ${esc(p.date)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></button>`;
const favCard=f=>`<div class="card"><img class="mb" src="${esc(f.img)}" alt="${esc(f.name)}"><span class="tag">${esc(f.cat)}</span><div class="row"><a class="btn" href="${esc(f.url&&f.url!=='#'?f.url:STOREFRONT)}" target="_blank" rel="noopener sponsored">Shop on Amazon</a></div></div>`;
const shopCard=s=>`<div class="card"><div class="swatch" style="background:var(--rose)">${s.emoji}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><div class="row"><span class="price">${esc(s.price)}</span><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Buy now</a></div></div>`;

const views={
 home:()=>`
 <div class="hero"><div>
  <p class="hand" style="font-size:22px;color:var(--gold);margin-bottom:10px">Create · Explore · Elevate</p>
  <h1>good ideas, bigger plans</h1>
  <p>Welcome to the Ray Edit. A space for creating a life that feels uniquely yours. Here, you’ll find inspiration for your style, home, work, travels, finances, and everything in between—from thoughtfully curated product recommendations and practical digital tools to personal stories, ideas I’m learning, and places worth discovering. My goal is to make everyday life a little more creative, organized, adventurous, and inspiring.</p>
  <button class="btn" onclick="go('blog')">Read the blog</button><button class="btn alt" onclick="go('shop')">Shop digital products</button>
 </div><div class="frame"><img src="${IMG}" alt="Illustration of Ray at her desk with a laptop, iced coffee, and stacked books"><span class="hand">Little ideas for a life beautifully lived ♡</span></div></div>
 <section><h2>Latest from the blog</h2><p class="sub">New posts, most recent first.</p><div class="grid">${POSTS.slice(0,3).map(postCard).join('')}</div><p style="text-align:center;margin-top:28px"><button class="btn" onclick="B.q='';B.topic='All';B.month='All';go('blog')">View all posts</button></p></section>
 <section><div class="shop"><h2>The shop</h2><p class="sub">Instant downloads to plan, budget, and reset.</p><div class="grid">${SHOP.map(shopCard).join('')}</div></div></section>`,
 blog:()=>{
  const topics=['All',...new Set(POSTS.map(p=>p.tag))];
  const months=[...new Set(POSTS.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(mk))];
  return `<section><h2>The blog</h2><p class="sub">Search the archive, or filter by topic and date.</p>
  <div class="tools"><input type="search" placeholder="Search posts" aria-label="Search posts" value="${esc(B.q)}" oninput="B.q=this.value;showPosts()">
  <select aria-label="Filter by date" onchange="B.month=this.value;showPosts()"><option value="All">All dates</option>${months.map(m=>`<option ${m===B.month?'selected':''}>${m}</option>`).join('')}</select>
  <select aria-label="Sort posts" onchange="B.sort=this.value;showPosts()"><option value="new" ${B.sort==='new'?'selected':''}>Newest first</option><option value="old" ${B.sort==='old'?'selected':''}>Oldest first</option></select></div>
  <div class="chips">${topics.map(t=>`<button class="${t===B.topic?'on':''}" onclick="B.topic='${t}';go('blog')">${t==='All'?'All topics':t}</button>`).join('')}</div>
  <div class="grid" id="results"></div></section>`},
 post:id=>{const p=POSTS.find(x=>x.id===id)||POSTS[0];return `<article><button class="back" onclick="go('blog')">Back to all posts</button><h1>${esc(p.title)}</h1><p class="tag">${esc(p.tag)} · ${esc(p.date)}</p><br>${p.body.map(t=>`<p>${esc(t)}</p>`).join('')}</article>`},
 favs:()=>{const cats=[...new Set(['All','Accessories','Winter Essentials','Apartment Essentials',...FAVS.map(f=>f.cat)])];const list=FAVS.filter(f=>favCat==='All'||f.cat===favCat);
  return `<section><h2>Pinterest Favorites</h2><p class="sub">Moodboards of the things I love, each linked to my Amazon storefront.</p><div class="chips">${cats.map(c=>`<button class="${c===favCat?'on':''}" onclick="favCat='${c}';go('favs')">${c}</button>`).join('')}</div><div class="grid three">${list.length?list.map(favCard).join(''):'<p class="sub" style="grid-column:1/-1">Moodboard coming soon.</p>'}</div><p style="margin-top:28px;text-align:center"><a class="btn alt" style="margin:0" href="${esc(STOREFRONT)}" target="_blank" rel="noopener sponsored">Visit my full Amazon storefront</a></p><p class="note" style="text-align:center">As an Amazon Associate I may earn from qualifying purchases. I only share things I love.</p></section>`},
 shop:()=>`<section><div class="shop"><h2>The shop</h2><p class="sub">Digital downloads. You get your files right after checkout.</p><div class="grid">${SHOP.map(shopCard).join('')}</div></div></section>`
};
function go(v,arg){
 app.innerHTML=views[v](arg);
 const active=v==='post'?'blog':v;
 nav.innerHTML=[['blog','Blog'],['favs','Pinterest Favorites'],['shop','Shop']].map(([k,l])=>`<button class="${k===active?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 if(v==='blog')showPosts();
 scrollTo(0,0);
}
go('home');
</script>
</body>
</html>
